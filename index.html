<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陶老師 退休抓周</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
<style>
  :root{
    --red: #8f1d1d;
    --red-deep: #6e1414;
    --red-bright: #c62828;
    --gold: #e0b959;
    --gold-light: #f6e3ab;
    --gold-deep: #a9812f;
    --cream: #fff7e6;
    --ink: #3a1210;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 50% -10%, rgba(255,255,255,0.10), transparent 55%),
      linear-gradient(160deg, var(--red-bright) 0%, var(--red) 45%, var(--red-deep) 100%);
    background-attachment:fixed;
    font-family:'Iansui', sans-serif;
    color:var(--cream);
    min-height:100vh;
    padding:44px 20px 90px;
  }
  .wrap{max-width:1280px;margin:0 auto;}

  header{
    text-align:center;
    margin-bottom:44px;
  }
  .title{
    font-size:clamp(38px, 6vw, 68px);
    letter-spacing:10px;
    color:var(--gold-light);
    text-shadow:0 2px 0 rgba(0,0,0,0.35), 0 0 30px rgba(224,185,89,0.35);
  }
  .title .accent{
    color:var(--cream);
  }
  .subtitle{
    margin-top:14px;
    font-size:clamp(15px, 2.2vw, 20px);
    letter-spacing:3px;
    color:var(--gold-light);
    opacity:0.92;
  }
  .rule{
    margin:20px auto 0;
    width:min(90%, 480px);
    height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .toolbar{
    display:flex;
    justify-content:center;
    margin:26px 0 40px;
  }
  .shuffle-btn{
    font-family:'Iansui', sans-serif;
    font-size:18px;
    letter-spacing:3px;
    color:var(--ink);
    background:linear-gradient(160deg, var(--gold-light), var(--gold));
    border:2px solid var(--gold-deep);
    border-radius:30px;
    padding:12px 32px;
    cursor:pointer;
    box-shadow:0 6px 14px rgba(0,0,0,0.3);
  }
  .shuffle-btn:active{transform:translateY(1px);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:30px;
  }

  .card{
    perspective:1600px;
    -webkit-perspective:1600px;
    height:330px;
    cursor:pointer;
  }
  .card-inner{
    position:relative;
    width:100%;height:100%;
    transition:transform 0.7s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
  }
  .card.flipped .card-inner{
    transform:rotateY(180deg);
    -webkit-transform:rotateY(180deg);
  }
  .face{
    position:absolute;inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    -webkit-transform-style:preserve-3d;
    transform:rotateY(0deg) translateZ(0.1px);
    -webkit-transform:rotateY(0deg) translateZ(0.1px);
    border-radius:16px;
    overflow:hidden;
    border:3px solid var(--gold);
    box-shadow:0 12px 24px rgba(0,0,0,0.4), inset 0 0 0 2px rgba(255,255,255,0.15);
  }

  /* ---- Front: image medallion ---- */
  .front{
    background:linear-gradient(160deg, #7a1414, #5c0f0f);
    display:flex;
    flex-direction:column;
  }
  .front .imgwrap{
    position:relative;
    flex:1;
    overflow:hidden;
  }
  .front .imgwrap img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(1.05);
  }
  .front .imgwrap::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(40,10,10,0.88) 100%);
  }
  .front .tags{
    position:absolute;
    left:0;right:0;bottom:10px;
    z-index:2;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    padding:0 10px;
  }
  .front .tags span{
    font-size:12.5px;
    color:var(--ink);
    background:var(--gold-light);
    border:1px solid var(--gold-deep);
    padding:3px 10px;
    border-radius:14px;
    letter-spacing:0.5px;
  }
  .front .hint{
    position:absolute;
    top:10px;left:0;right:0;
    text-align:center;
    z-index:2;
    font-size:13px;
    letter-spacing:3px;
    color:var(--gold-light);
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }

  /* ---- Back: red reveal ---- */
  .back{
    transform:rotateY(180deg) translateZ(0.1px);
    -webkit-transform:rotateY(180deg) translateZ(0.1px);
    background:
      radial-gradient(circle at 50% 20%, rgba(255,255,255,0.10), transparent 55%),
      linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 60%, var(--gold-deep) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:22px 16px;
    gap:10px;
  }
  .back .label{
    font-size:13px;
    letter-spacing:4px;
    color:var(--red-deep);
    opacity:0.85;
  }
  .back .who{
    font-size:clamp(24px, 3.6vw, 30px);
    color:var(--red-deep);
    line-height:1.3;
  }
  .back .who .nick{
    display:block;
    font-size:16px;
    color:var(--ink);
    opacity:0.85;
    margin-top:2px;
  }
  .back .tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    margin-top:6px;
  }
  .back .tags span{
    font-size:12.5px;
    color:var(--cream);
    background:var(--red-deep);
    padding:3px 10px;
    border-radius:14px;
  }
  .back .cta{
    margin-top:14px;
    font-size:14px;
    letter-spacing:2px;
    color:var(--red-deep);
    border-top:1px dashed var(--red-deep);
    padding-top:10px;
    width:80%;
  }

  footer{
    text-align:center;
    margin-top:70px;
    color:var(--gold-light);
    font-size:14px;
    letter-spacing:3px;
    opacity:0.9;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><span class="accent">退休</span>抓周</div>
    <div class="subtitle">陶老師的下一站，由你們決定</div>
    <div class="rule"></div>
  </header>

  <div class="toolbar">

  <div class="grid" id="grid"></div>

  <footer>老師抽中誰，就請誰上台！</footer>
</div>

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const grid = document.getElementById('grid');

function render(){
  grid.innerHTML = '';
  const order = shuffle(DATA);
  order.forEach((d) => {
    const card = document.createElement('div');
    card.className = 'card';

    const tagsHtml = d.kw.filter(k => k && k.trim()).map(k => `<span>#${escapeHtml(k)}</span>`).join('');
    const nickHtml = d.nickname && d.nickname.trim() ? `<span class="nick">(${escapeHtml(d.nickname)})</span>` : '';

    card.innerHTML = `
      <div class="card-inner">
        <div class="face front">
          <div class="hint">✦ 抓一張 ✦</div>
          <div class="imgwrap">
            <img src="${d.imgUrl}" alt="${escapeHtml(d.imgLabel)}" loading="lazy">
            <div class="tags">${tagsHtml}</div>
          </div>
        </div>
        <div class="face back">
          <div class="label">是你嗎</div>
          <p class="who">${escapeHtml(d.name)}${nickHtml}</p>
          <div class="tags">${tagsHtml}</div>
          <div class="cta">請主持人邀請上台！</div>
        </div>
      </div>
    `;

    card.addEventListener('click', () => card.classList.toggle('flipped'));
    grid.appendChild(card);
  });
}

render();
document.getElementById('shuffleBtn').addEventListener('click', render);
